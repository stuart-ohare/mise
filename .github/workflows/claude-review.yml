name: claude-review

# Independent invariant review of every PR, once: when it opens ready for review, or
# when a draft is marked ready. Not on every push — it costs a model run each time
# (CLAUDE.md §4.5). Advisory: it comments and never fails the job, and it is not a
# required check on main.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # Drafts wait for ready_for_review. Fork PRs get no secrets.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            BRANCH: ${{ github.head_ref }}

            Run the `invariant-reviewer` agent (.claude/agents/invariant-reviewer.md).
            Give it only this: the issue number (the leading digits of BRANCH, or the
            `Closes #n` in the PR body if BRANCH has none), base ref `origin/main`, and
            the working directory. Do not add your own opinion of the change.

            Then post the agent's report verbatim as ONE comment on the PR:
              gh pr comment ${{ github.event.pull_request.number }} --body-file - <<'REPORT'
              <report>
              REPORT
            Prefix it with a single line: "_Automated invariant review — advisory; a human decides._"
            Do not post inline comments, approve, request changes, or edit anything.
          claude_args: >-
            --model claude-opus-5
            --max-turns 30
            --allowedTools "Task,Agent,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit"
